services:
  gldash:
    build: .
    # Overridable so the same file works for a local build and for pulling a
    # prebuilt image from a private registry. Set GLDASH_IMAGE in .env (which is
    # gitignored) — see docker-compose.override.example.yml.
    image: ${GLDASH_IMAGE:-gldash:latest}
    container_name: gldash
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - CONFIG_PATH=/app/config/config.yaml
      - PORT=3000
      - BODY_SIZE_LIMIT=6M
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 100
    volumes:
      - ./config:/app/config
      - ./static/backgrounds:/app/static/backgrounds
