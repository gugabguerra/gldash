# Leave adminPasswordHash empty on first run. The app prompts to set it.
# To reset the password, clear this value and restart.
auth:
  adminPasswordHash: ''
settings:
  # structure: how categories are arranged — board | panel | wall
  # density:   how apps are drawn inside them — rows | cards | tiles
  structure: board
  density: cards
  columns: 4
  appName: GLdash
  theme:
    background: '#0f172a'
    textColor: '#34d399'
    cardBackground: '#1e293b'
    # Drives interactive state only: selection, focus, hover, edit mode.
    accent: '#36d3d0'
    # solid | gradient | custom
    backgroundMode: gradient

categories:
  - id: infra
    name: Infrastructure
    apps:
      - id: pihole-01
        title: Pi-hole
        url: http://192.168.1.10/admin
        icon: simple-icons:pihole
        note: Primary DNS server
      - id: traefik-01
        title: Traefik
        url: http://192.168.1.10:8080
        icon: simple-icons:traefikproxy
        note: Reverse Proxy

  - id: media
    name: Media
    apps:
      - id: plex-01
        title: Plex
        url: http://192.168.1.10:32400/web
        icon: simple-icons:plex
        note: Media Server
      - id: jellyfin-01
        title: Jellyfin
        url: http://192.168.1.10:8096
        icon: simple-icons:jellyfin
        note: Media Player

  - id: maintenance
    name: Maintenance
    apps:
      - id: portainer
        title: Portainer
        url: http://192.168.1.10:9443
        icon: simple-icons:portainer
        note: Docker stacks manager
