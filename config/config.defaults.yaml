settings:
  layout: grid
  columns: 4
  theme:
    background: '#0f172a'
    textColor: '#f8fafc'
    cardBackground: '#1e293b'
    backgroundMode: default

categories:
  - id: infra
    name: Infrastructure
    apps:
      - id: pihole-01
        title: Pi-hole
        url: http://192.168.1.10/admin
        icon: simple-icons:pihole
        note: Primary DNS server
      - id: traefik-01
        title: Traefik
        url: http://192.168.1.10:8080
        icon: simple-icons:traefikproxy
        note: Reverse Proxy

  - id: media
    name: Media
    apps:
      - id: plex-01
        title: Plex
        url: http://192.168.1.10:32400/web
        icon: simple-icons:plex
        note: Media Server
      - id: jellyfin-01
        title: Jellyfin
        url: http://192.168.1.10:8096
        icon: simple-icons:jellyfin
        note: Media Player

  - id: maintenance
    name: Maintenance
    apps:
      - id: portainer
        title: Portainer
        url: http://192.168.1.10:9443
        icon: simple-icons:portainer
        note: Docker stacks manager
